[package]
name = "mesh-discord"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.32"
# Already in the tree through iced; decodes call video frames off the UI thread.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["net", "io-util", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
