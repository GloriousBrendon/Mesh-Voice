[package]
name = "mesh-dc"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, like mesh-wa: songbird pins reqwest 0.12 / tungstenite 0.26,
# a second copy of each that Mesh itself never needs to build.
[workspace]

[dependencies]
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "receive", "rustls", "tungstenite"] }
anyhow = "1"
async-channel = "2.5"
async-trait = "0.1"
base64 = "0.22"
cpal = "0.18"
env_logger = "0.11"
flate2 = "1"
futures-util = "0.3"
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ringbuf = "0.5"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# The exe's icon and version info (Task Manager shows "Mesh Discord").
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
